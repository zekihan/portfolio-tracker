{{define "holding-form"}}{{with .Holding}}
<div class="modal-overlay" id="holding-modal" role="dialog" aria-modal="true" aria-labelledby="holding-modal-title">
    <div class="modal modal-lg">
        <header class="modal-header">
            <h2 id="holding-modal-title">{{if .ID}}Edit Holding{{else}}Add Holding{{end}}</h2>
            <button class="btn btn-ghost btn-sm modal-close" aria-label="Close" data-close-modal>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </header>
        <form class="modal-body" data-holding-form data-id="{{.ID}}">
            <p class="form-error" role="alert" hidden></p>

            <fieldset class="form-section">
                <legend>Basic</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" class="form-input" value="{{.Name}}" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="ticker">Ticker</label>
                        <input type="text" id="ticker" name="ticker" class="form-input" value="{{.Ticker}}" placeholder="NASDAQ:AAPL" autocomplete="off">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="asset_type">Asset Type *</label>
                        <select id="asset_type" name="asset_type" class="form-select" required>
                            <option value="Stock" {{if eq .AssetType "Stock"}}selected{{end}}>Stock</option>
                            <option value="ETF" {{if eq .AssetType "ETF"}}selected{{end}}>ETF</option>
                            <option value="TR Fund" {{if eq .AssetType "TR Fund"}}selected{{end}}>TR Fund</option>
                            <option value="Crypto" {{if eq .AssetType "Crypto"}}selected{{end}}>Crypto</option>
                            <option value="Gold" {{if eq .AssetType "Gold"}}selected{{end}}>Gold</option>
                            <option value="Cash" {{if eq .AssetType "Cash"}}selected{{end}}>Cash</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity *</label>
                        <input type="number" id="quantity" name="quantity" class="form-input" value="{{.Quantity}}" step="any" min="0" required>
                    </div>
                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>Pricing</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label for="price_provider">Price Provider</label>
                        <select id="price_provider" name="price_provider" class="form-select">
                            <option value="">Select provider...</option>
                            {{range $.Providers}}
                            <option value="{{.Name}}" {{if eq .Name $.Holding.PriceProvider}}selected{{end}}>{{.Name}}</option>
                            {{end}}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="instrument_id" id="instrument-label">Instrument ID</label>
                        <input type="text" id="instrument_id" name="instrument_id" class="form-input" value="{{.InstrumentID}}" placeholder="e.g., AAPL" autocomplete="off">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="est_price">Est. Price (optional)</label>
                        <input type="number" id="est_price" name="est_price" class="form-input" value="{{.EstPrice}}" step="any" min="0" placeholder="Scenario price">
                    </div>
                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>Metadata</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label for="base_currency">Base Currency</label>
                        <select id="base_currency" name="base_currency" class="form-select">
                            <option value="TRY" {{if eq .BaseCurrency "TRY"}}selected{{end}}>TRY</option>
                            <option value="USD" {{if eq .BaseCurrency "USD"}}selected{{end}}>USD</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="basket">Basket</label>
                        <input type="text" id="basket" name="basket" class="form-input" value="{{.Basket}}" autocomplete="off">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" class="form-input" value="{{.Location}}" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" class="form-textarea" rows="3" placeholder="Optional notes...">{{.Notes}}</textarea>
                </div>
            </fieldset>

            <footer class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                <button type="submit" class="btn btn-primary">{{if .ID}}Save Changes{{else}}Add Holding{{end}}</button>
            </footer>
        </form>
    </div>
</div>
{{end}}
{{end}}
