{{define "manual-price"}}{{with .Holding}}
<div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="manual-price-title">
    <div class="modal">
        <header class="modal-header">
            <h2 id="manual-price-title">Manual Price — {{.Name}}</h2>
            <button type="button" class="btn btn-ghost modal-close" data-close-modal aria-label="Close">×</button>
        </header>
        <form class="modal-body" data-manual-price-form data-id="{{.ID}}">
            <p class="form-error" role="alert" hidden></p>
            <div class="form-group">
                <label for="manual-price">Price ({{.BaseCurrency}})</label>
                <input id="manual-price" name="price" class="form-input" type="number" min="0" step="any" value="{{if .ManualPrice.Valid}}{{.ManualPrice.Float64}}{{end}}" required>
                <p class="setting-note">A positive manual price overrides the provider. Clear it to use provider pricing.</p>
            </div>
            <footer class="modal-footer">
                <button type="button" class="btn btn-secondary" data-clear-manual-price>Clear Override</button>
                <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
                <button type="submit" class="btn btn-primary">Save Price</button>
            </footer>
        </form>
    </div>
</div>
{{end}}{{end}}
