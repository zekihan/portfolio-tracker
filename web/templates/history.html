{{define "content"}}
<div class="history-page">
    <header class="page-header">
        <h1>History</h1>
    </header>

    <!-- Filters -->
    <section class="card filters-card" aria-labelledby="filters-heading">
        <h2 id="filters-heading">Filters</h2>
        <div class="filter-grid">
            <div class="filter-group">
                <label for="date-range">Date Range</label>
                <select id="date-range" class="form-select">
                    <option value="365" {{if eq .Days 365}}selected{{end}}>1 Year</option>
                    <option value="180" {{if eq .Days 180}}selected{{end}}>6 Months</option>
                    <option value="90" {{if eq .Days 90}}selected{{end}}>3 Months</option>
                    <option value="30" {{if eq .Days 30}}selected{{end}}>1 Month</option>
                    <option value="7" {{if eq .Days 7}}selected{{end}}>1 Week</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-currency">Currency</label>
                <select id="filter-currency" name="currency" class="form-select">
                    <option value="TRY" {{if eq .DisplayCurrency "TRY"}}selected{{end}}>TRY</option>
                    <option value="USD" {{if eq .DisplayCurrency "USD"}}selected{{end}}>USD</option>
                </select>
            </div>
            <div class="filter-group filter-actions">
                <button class="btn btn-secondary" id="reset-filters">Reset</button>
            </div>
        </div>
    </section>

    <!-- Portfolio Value Chart -->
    <section class="card chart-card" aria-labelledby="portfolio-chart-heading">
        <h2 id="portfolio-chart-heading">Portfolio Value</h2>
        <div class="chart-container" style="height: 400px;">
            <canvas id="portfolio-chart" aria-label="Portfolio value over time"></canvas>
        </div>
    </section>

    <!-- Holding History Chart -->
    <section class="card chart-card" aria-labelledby="holding-chart-heading">
        <h2 id="holding-chart-heading">Holding History</h2>
        <div class="filter-grid" style="margin-bottom: 1rem;">
            <div class="filter-group">
                <label for="holding-select">Holding</label>
                <select id="holding-select" class="form-select">
                    <option value="">Select a holding...</option>
                    <!-- Populated from holdings. -->
                </select>
            </div>
            <div class="filter-group">
                <label for="holding-basket">Basket</label>
                <select id="holding-basket" name="holding-basket" class="form-select">
                    <option value="">All Baskets</option>
                    {{range .Baskets}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
            </div>
            <div class="filter-group">
                <label for="holding-location">Location</label>
                <select id="holding-location" name="holding-location" class="form-select">
                    <option value="">All Locations</option>
                    {{range .Locations}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
            </div>
        </div>
        <div class="chart-container" style="height: 300px;">
            <canvas id="holding-chart" aria-label="Holding value over time"></canvas>
        </div>
    </section>

    <!-- Snapshot Table -->
    <section class="card" aria-labelledby="snapshots-heading">
        <h2 id="snapshots-heading">Snapshots</h2>
        <div class="table-container">
            <table class="snapshots-table">
                <thead>
                    <tr>
                        <th scope="col">Time (UTC)</th>
                        <th scope="col" class="numeric" id="snapshot-value-heading">Value ({{.DisplayCurrency}})</th>
                        <th scope="col" class="numeric">USD/TRY</th>
                        <th scope="col" class="numeric">Stale</th>
                        <th scope="col" class="numeric">Failed</th>
                        <th scope="col">Notes</th>
                    </tr>
                </thead>
                <tbody id="snapshots-tbody">
                    <tr><td colspan="6">Loading snapshots…</td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <button class="btn btn-ghost btn-sm" id="first-page" disabled>First</button>
            <button class="btn btn-ghost btn-sm" id="prev-page" disabled>Previous</button>
            <span id="page-info">Page 1</span>
            <button class="btn btn-ghost btn-sm" id="next-page" disabled>Next</button>
        </div>
    </section>
</div>
{{end}}
{{template "layout" .}}
