{{define "layout"}}
<!DOCTYPE html>
<html lang="en" data-theme="{{.Theme}}" data-currency="{{.DisplayCurrency}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Portfolio Tracker</title>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/response-targets.js"></script>
    
    <!-- Chart.js -->
    <script src="/static/chart.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/static/style.css">
    
    <!-- Theme detection -->
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'system';
            var root = document.documentElement;
            if (theme === 'system') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <!-- Header -->
    <header class="header" role="banner">
        <div class="header-left">
            <a href="/" class="logo" aria-label="Portfolio Tracker Home">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Portfolio</span>
            </a>
        </div>
        
        <nav class="header-nav" role="navigation" aria-label="Main navigation">
            <a href="/" class="nav-link {{if eq .ActivePage "dashboard"}}active{{end}}" aria-current="{{if eq .ActivePage "dashboard"}}page{{end}}">Overview</a>
            <a href="/holdings" class="nav-link {{if eq .ActivePage "holdings"}}active{{end}}" aria-current="{{if eq .ActivePage "holdings"}}page{{end}}">Holdings</a>
            <a href="/history" class="nav-link {{if eq .ActivePage "history"}}active{{end}}" aria-current="{{if eq .ActivePage "history"}}page{{end}}">History</a>
            <a href="/sources" class="nav-link {{if eq .ActivePage "sources"}}active{{end}}" aria-current="{{if eq .ActivePage "sources"}}page{{end}}">Price Sources</a>
            <a href="/settings" class="nav-link {{if eq .ActivePage "settings"}}active{{end}}" aria-current="{{if eq .ActivePage "settings"}}page{{end}}">Settings</a>
        </nav>
        
        <div class="header-right">
            <!-- Currency Switcher -->
            <div class="currency-switcher" role="group" aria-label="Display currency">
                <button type="button" class="btn btn-ghost currency-btn" aria-expanded="false" aria-controls="currency-menu">
                    <span class="currency-current">{{.DisplayCurrency}}</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="currency-menu" class="dropdown-menu" role="menu" aria-hidden="true"></div>
            </div>
            
            <!-- Theme Toggle -->
            <button class="btn btn-ghost theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
        
        <!-- Mobile menu toggle -->
        <button class="mobile-menu-toggle btn btn-ghost" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-nav">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>

    <!-- Mobile bottom navigation -->
    <nav class="mobile-bottom-nav" role="navigation" aria-label="Mobile bottom navigation">
        <a href="/" class="mobile-nav-item {{if eq .ActivePage "dashboard"}}active{{end}}" aria-current="{{if eq .ActivePage "dashboard"}}page{{end}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                <path d="M8 21h8"></path>
                <path d="M12 17v4"></path>
            </svg>
            <span>Overview</span>
        </a>
        <a href="/holdings" class="mobile-nav-item {{if eq .ActivePage "holdings"}}active{{end}}" aria-current="{{if eq .ActivePage "holdings"}}page{{end}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>Holdings</span>
        </a>
        <a href="/history" class="mobile-nav-item {{if eq .ActivePage "history"}}active{{end}}" aria-current="{{if eq .ActivePage "history"}}page{{end}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3v18h18"></path>
                <path d="m19 9-5 5-4-4-3 3"></path>
            </svg>
            <span>History</span>
        </a>
        <a href="/sources" class="mobile-nav-item {{if eq .ActivePage "sources"}}active{{end}}" aria-current="{{if eq .ActivePage "sources"}}page{{end}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span>Sources</span>
        </a>
        <a href="/settings" class="mobile-nav-item {{if eq .ActivePage "settings"}}active{{end}}" aria-current="{{if eq .ActivePage "settings"}}page{{end}}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Main content -->
    <main class="main" role="main">
        {{block "content" .}}{{end}}
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

    <!-- Modal container -->
    <div id="modal-container"></div>

    <!-- Scripts -->
    <script src="/static/app.js"></script>
</body>
</html>
{{end}}
