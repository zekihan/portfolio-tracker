name: Checks
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
      - name: Check formatting and modules
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: make lint test
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          install-only: true
          version: v2.18.3
      - run: make release-check build/release/all
      - run: git diff --exit-code
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          install-only: true
          version: v2.18.3
      - run: make container-test
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout=5m ./...
      - uses: actions/setup-node@v7.1.0
        if: runner.os == 'macOS'
        with:
          node-version: 24.22.1
      - name: Test browser and delivery scripts on macOS
        if: runner.os == 'macOS'
        run: make test/web test/scripts
