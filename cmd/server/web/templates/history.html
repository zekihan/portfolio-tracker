{{define "content"}}
<div class="history-page">
    <header class="page-header">
        <h1>History</h1>
    </header>

    <!-- Filters -->
    <section class="card filters-card" aria-labelledby="filters-heading">
        <h2 id="filters-heading">Filters</h2>
        <div class="filter-grid">
            <div class="filter-group">
                <label for="date-range">Date Range</label>
                <select id="date-range" class="form-select" hx-get="/api/history/chart" hx-target="#portfolio-chart" hx-include="[name='basket'],[name='location'],[name='asset_type'],[name='currency']" hx-vals='js:{days: document.getElementById("date-range").value}'>
                    <option value="365" {{if eq .Days 365}}selected{{end}}>1 Year</option>
                    <option value="180" {{if eq .Days 180}}selected{{end}}>6 Months</option>
                    <option value="90" {{if eq .Days 90}}selected{{end}}>3 Months</option>
                    <option value="30" {{if eq .Days 30}}selected{{end}}>1 Month</option>
                    <option value="7" {{if eq .Days 7}}selected{{end}}>1 Week</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-basket">Basket</label>
                <select id="filter-basket" name="basket" class="form-select" hx-get="/api/history/chart" hx-target="#portfolio-chart" hx-include="[name='date-range'],[name='location'],[name='asset_type'],[name='currency']">
                    <option value="">All Baskets</option>
                    {{range .Baskets}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-location">Location</label>
                <select id="filter-location" name="location" class="form-select" hx-get="/api/history/chart" hx-target="#portfolio-chart" hx-include="[name='date-range'],[name='basket'],[name='asset_type'],[name='currency']">
                    <option value="">All Locations</option>
                    {{range .Locations}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-asset-type">Asset Type</label>
                <select id="filter-asset-type" name="asset_type" class="form-select" hx-get="/api/history/chart" hx-target="#portfolio-chart" hx-include="[name='date-range'],[name='basket'],[name='location'],[name='currency']">
                    <option value="">All Types</option>
                    {{range .AssetTypes}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-currency">Currency</label>
                <select id="filter-currency" name="currency" class="form-select" hx-get="/api/history/chart" hx-target="#portfolio-chart" hx-include="[name='date-range'],[name='basket'],[name='location'],[name='asset_type']">
                    <option value="TRY" {{if eq .DisplayCurrency "TRY"}}selected{{end}}>TRY</option>
                    <option value="USD" {{if eq .DisplayCurrency "USD"}}selected{{end}}>USD</option>
                </select>
            </div>
            <div class="filter-group filter-actions">
                <button class="btn btn-secondary" id="reset-filters">Reset</button>
            </div>
        </div>
    </section>

    <!-- Portfolio Value Chart -->
    <section class="card chart-card" aria-labelledby="portfolio-chart-heading">
        <h2 id="portfolio-chart-heading">Portfolio Value</h2>
        <div class="chart-container" style="height: 400px;">
            <canvas id="portfolio-chart" aria-label="Portfolio value over time"></canvas>
        </div>
    </section>

    <!-- Holding History Chart -->
    <section class="card chart-card" aria-labelledby="holding-chart-heading">
        <h2 id="holding-chart-heading">Holding History</h2>
        <div class="filter-grid" style="margin-bottom: 1rem;">
            <div class="filter-group">
                <label for="holding-select">Holding</label>
                <select id="holding-select" class="form-select" hx-get="/partials/holding-history-chart" hx-target="#holding-chart" hx-include="[name='holding-basket'],[name='holding-location']">
                    <option value="">Select a holding...</option>
                    <!-- Populated via HTMX -->
                </select>
            </div>
            <div class="filter-group">
                <label for="holding-basket">Basket</label>
                <select id="holding-basket" name="holding-basket" class="form-select" hx-get="/partials/holding-options" hx-target="#holding-select" hx-include="[name='holding-location']">
                    <option value="">All Baskets</option>
                    {{range .Baskets}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
            </div>
            <div class="filter-group">
                <label for="holding-location">Location</label>
                <select id="holding-location" name="holding-location" class="form-select" hx-get="/partials/holding-options" hx-target="#holding-select" hx-include="[name='holding-basket']">
                    <option value="">All Locations</option>
                    {{range .Locations}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
            </div>
        </div>
        <div class="chart-container" style="height: 300px;">
            <canvas id="holding-chart" aria-label="Holding value over time"></canvas>
        </div>
    </section>

    <!-- Snapshot Table -->
    <section class="card" aria-labelledby="snapshots-heading">
        <h2 id="snapshots-heading">Snapshots</h2>
        <div class="table-container">
            <table class="snapshots-table">
                <thead>
                    <tr>
                        <th scope="col">Time (UTC)</th>
                        <th scope="col" class="numeric">Value (TRY)</th>
                        <th scope="col" class="numeric">USD/TRY</th>
                        <th scope="col" class="numeric">Stale</th>
                        <th scope="col" class="numeric">Failed</th>
                        <th scope="col">Notes</th>
                    </tr>
                </thead>
                <tbody id="snapshots-tbody" hx-get="/api/history/snapshots" hx-trigger="load, portfolio-updated from:body" hx-target="this" hx-swap="innerHTML">
                    <!-- Loaded via HTMX -->
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <button class="btn btn-ghost btn-sm" hx-get="/api/history/snapshots?offset=0" hx-target="#snapshots-tbody" hx-swap="innerHTML">First</button>
            <button class="btn btn-ghost btn-sm" id="prev-page" hx-get="/api/history/snapshots?offset={{sub .Offset 50}}" hx-target="#snapshots-tbody" hx-swap="innerHTML">Previous</button>
            <span id="page-info">Page 1</span>
            <button class="btn btn-ghost btn-sm" id="next-page" hx-get="/api/history/snapshots?offset={{add .Offset 50}}" hx-target="#snapshots-tbody" hx-swap="innerHTML">Next</button>
        </div>
    </section>
</div>
{{end}}
