version: 2
project_name: portfolio-tracker
builds:
  - id: all
    main: ./cmd/server
    binary: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}/{{ .ProjectName }}'
    no_unique_dist_dir: true
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: docker
    main: ./cmd/server
    binary: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}/{{ .ProjectName }}'
    no_unique_dist_dir: true
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux]
    goarch: [amd64, arm64]
universal_binaries:
  - id: darwin-universal
    ids: [all]
    name_template: portfolio-tracker
    replace: false
archives:
  - id: all
    ids: [all, darwin-universal]
    formats: [tar.gz]
    strip_binary_directory: true
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: web
        dst: web
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  github:
    owner: zekihan
    name: portfolio-tracker
  ids: [all]
