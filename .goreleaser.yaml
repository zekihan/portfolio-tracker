version: 2
project_name: portfolio-tracker
builds:
  - id: all
    main: ./cmd/server
    binary: portfolio-tracker
    # SQLite needs cgo; Linux releases are built with the runner's native gcc.
    env: [CGO_ENABLED=1]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux]
    goarch: [amd64]
archives:
  - id: all
    ids: [all]
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - src: web
        dst: web
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  github:
    owner: zekihan
    name: portfolio-tracker
  ids: [all]
